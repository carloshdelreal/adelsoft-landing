name: PR Build Check

on:
  pull_request:
    branches: [ master ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build
      env:
        NEXT_PUBLIC_GTM_ID: G-J0N1JL8YR4
      run: npm run build
